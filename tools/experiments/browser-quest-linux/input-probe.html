<!doctype html><meta charset="utf-8"><title>Linux input probe</title>
<style>body{background:#182438;color:#fff;font:24px sans-serif}button{position:fixed;left:0;top:0;width:100%;height:45vh;font:32px sans-serif}input{position:fixed;left:10%;top:55vh;width:80%;height:120px;font:32px sans-serif}pre{position:fixed;top:75vh;left:10%;font:18px monospace}</style>
<button id="button">Click / drag test</button><input id="field" placeholder="Keyboard test"><pre id="result"></pre>
<script>
const metrics={source:'input',clicks:0,downs:0,ups:0,moves_pressed:0,key_downs:0,key_ups:0,insert_count:0,input_length:0,ctrl_held:false,shift_held:false};
const field=document.querySelector('#field');
document.querySelector('#button').onclick=()=>metrics.clicks++;
document.onpointerdown=()=>metrics.downs++;
document.onpointerup=()=>metrics.ups++;
document.onpointermove=e=>{if(e.buttons)metrics.moves_pressed++;};
document.onkeydown=e=>{metrics.key_downs++;if(e.key==='Insert')metrics.insert_count++;metrics.ctrl_held=e.ctrlKey;metrics.shift_held=e.shiftKey;};
document.onkeyup=e=>{metrics.key_ups++;metrics.ctrl_held=e.ctrlKey;metrics.shift_held=e.shiftKey;};
field.oninput=()=>metrics.input_length=field.value.length;
setInterval(()=>{document.querySelector('#result').textContent=JSON.stringify(metrics);navigator.sendBeacon('http://127.0.0.1:6083/',JSON.stringify(metrics));},500);
</script>
