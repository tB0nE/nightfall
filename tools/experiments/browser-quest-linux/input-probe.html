<!doctype html><meta charset="utf-8"><title>Linux input probe</title>
<style>body{background:#182438;color:#fff;font:24px sans-serif;min-height:220vh}#button{position:fixed;left:0;top:0;width:100%;height:45vh;font:32px sans-serif}input{position:fixed;left:10%;top:55vh;width:80%;height:120px;font:32px sans-serif}pre{position:fixed;top:75vh;left:10%;font:18px monospace}#profile{position:fixed;right:0;top:0;width:220px;height:60px;background:#345;z-index:5}#profile-menu{display:none;position:absolute;top:60px;right:0;width:220px;height:60px;background:#567}#profile:hover #profile-menu{display:block}#profile-menu button{width:100%;height:60px;font:20px sans-serif}</style>
<button id="button">Click / drag test</button><input id="field" placeholder="Keyboard test"><pre id="result"></pre>
<div id="profile">Profile<div id="profile-menu"><button id="profile-action">Profile action</button></div></div><audio id="test-audio" loop></audio>
<script>
const metrics={source:'input',clicks:0,downs:0,ups:0,moves_pressed:0,key_downs:0,key_ups:0,insert_count:0,input_length:0,ctrl_held:false,shift_held:false,touch_starts:0,touch_moves:0,touch_ends:0,touch_cancels:0,scroll_y:0,viewport_width:innerWidth,viewport_height:innerHeight,profile_actions:0,scrollbar_width:innerWidth-document.documentElement.clientWidth,media_paused:true};
const field=document.querySelector('#field');
const audio=document.querySelector('#test-audio');
// A quiet generated tone checks that closing/switching really stops the audio.
const samples=8000, wav=new ArrayBuffer(44+samples*2), header=new DataView(wav);
function text(at,s){for(let i=0;i<s.length;i++)header.setUint8(at+i,s.charCodeAt(i));}
text(0,'RIFF');header.setUint32(4,36+samples*2,true);text(8,'WAVE');text(12,'fmt ');
header.setUint32(16,16,true);header.setUint16(20,1,true);header.setUint16(22,1,true);header.setUint32(24,8000,true);header.setUint32(28,16000,true);header.setUint16(32,2,true);header.setUint16(34,16,true);text(36,'data');header.setUint32(40,samples*2,true);
for(let i=0;i<samples;i++)header.setInt16(44+i*2,Math.sin(i*2*Math.PI*220/8000)*1000,true);
audio.src=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));
document.querySelector('#button').onclick=()=>{metrics.clicks++;audio.play().catch(()=>{});};
document.querySelector('#profile-action').onclick=()=>metrics.profile_actions++;
document.onpointerdown=()=>metrics.downs++;
document.onpointerup=()=>metrics.ups++;
document.onpointermove=e=>{if(e.buttons)metrics.moves_pressed++;};
document.onkeydown=e=>{metrics.key_downs++;if(e.key==='Insert')metrics.insert_count++;metrics.ctrl_held=e.ctrlKey;metrics.shift_held=e.shiftKey;};
document.onkeyup=e=>{metrics.key_ups++;metrics.ctrl_held=e.ctrlKey;metrics.shift_held=e.shiftKey;};
for(const [name,key] of [['touchstart','touch_starts'],['touchmove','touch_moves'],['touchend','touch_ends'],['touchcancel','touch_cancels']]) document.addEventListener(name,()=>metrics[key]++,{passive:true});
window.addEventListener('scroll',()=>metrics.scroll_y=scrollY,{passive:true});
field.oninput=()=>metrics.input_length=field.value.length;
setInterval(()=>{metrics.media_paused=audio.paused;document.querySelector('#result').textContent=JSON.stringify(metrics);navigator.sendBeacon('http://127.0.0.1:6083/',JSON.stringify(metrics));},500);
</script>
