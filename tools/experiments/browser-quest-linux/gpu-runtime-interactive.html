<!doctype html><meta charset="utf-8"><title>Generated GPU interaction test</title>
<style>
html,body{margin:0;background:#121625;color:white;font:28px sans-serif;scroll-behavior:auto}
header{position:sticky;top:0;padding:18px;background:#345}
.row{height:220px;margin:12px;background:linear-gradient(120deg,#248,#a54);border-radius:15px}
.row:nth-child(2n){background:linear-gradient(60deg,#384,#836)}
</style>
<header>Generated scrolling and layout test — no video or account</header>
<main id="content"></main>
<script>
for(let i=0;i<40;i++){const d=document.createElement('div');d.className='row';d.textContent='Generated row '+i;content.append(d)}
window.nfProbe={frames:0,scroll_events:0,layout_changes:0};
addEventListener('scroll',()=>nfProbe.scroll_events++);
let start=performance.now();
function animate(t){nfProbe.frames++;const elapsed=t-start;
scrollTo(0,(Math.sin(elapsed/900)+1)*1800);
const width=(80+Math.sin(elapsed/500)*15).toFixed(1)+'%';
content.style.width=width;nfProbe.layout_changes++;requestAnimationFrame(animate)}
requestAnimationFrame(animate);
</script>
